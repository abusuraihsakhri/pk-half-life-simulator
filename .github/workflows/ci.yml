name: Test and security checks
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Generate isolated test signing key
        run: echo "AUDIT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q agents cli.py pk_sim.py pk_model.py simulator.py enrichment.py
      - name: Run Python tests
        run: python -m pytest -q
      - name: PK CLI runs without audit credentials
        run: env -u AUDIT_SECRET_KEY python cli.py pk --dose 500 --volume 40 --half-life 6 --hours 12 --points 3 > /dev/null
      - name: Verify HMAC module
        run: python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run browser-model tests
        run: |
          node --check web/pk-model.mjs
          node --check web/app.mjs
          node --test web/pk-model.test.mjs
