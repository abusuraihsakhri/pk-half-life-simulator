version: '3.8'

services:
  pk-half-life-simulator:
    build: .
    container_name: pk-half-life-simulator
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=pk-half-life-simulator-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
